<div id="game-container">
    <div id="status-bar">STATUS: LOADING...</div>
    <div id="action-area">
        <h1 id="screen-title">LOBBY AREA</h1>
        <p id="timer-text">RESTING: 25 SECONDS</p>
    </div>
</div>

<script>
    let timeLeft = 25;
    let timerText = document.getElementById("timer-text");
    let titleText = document.getElementById("screen-title");
    let statusText = document.getElementById("status-bar");

    let countdown = setInterval(() => {
        timeLeft--;
        timerText.innerText = "RESTING: " + timeLeft + " SECONDS";
        if (timeLeft <= 0) {
            clearInterval(countdown);
            prepareHelicopter();
        }
    }, 1000);

    function prepareHelicopter() {
        titleText.innerText = "HELICOPTER ARRIVED";
        timerText.innerText = "BOARDING NOW...";
        statusText.innerText = "STATUS: DEPLOYING TO BATTLEFIELD";
        
        let btn = document.createElement("button");
        btn.innerText = "JUMP FROM HELICOPTER";
        btn.onclick = () => { alert("MISSION STARTED! GOOD LUCK."); };
        document.getElementById("action-area").appendChild(btn);
    }
</script>
