<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master - Live Market</title>
    <!-- ہم اس میں chart_styles.css کو لنک کر رہے ہیں -->
    <link rel="stylesheet" href="chart_styles.css">
</head>
<body style="background-color: #121212; color: #ffffff; margin: 0; padding: 20px; font-family: Arial, sans-serif;">

    <div class="chart-wrapper" style="max-width: 1000px; margin: auto;">
        <h2 style="text-align: center; color: #00ff88; text-transform: uppercase;">FX Master Live Chart</h2>
        
        <!-- TradingView Widget BEGIN -->
        <div class="tradingview-widget-container" style="border: 2px solid #333; border-radius: 8px; overflow: hidden;">
            <div id="tradingview_chart"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
            new TradingView.widget({
                "width": "100%",
                "height": 500,
                "symbol": "FX:EURUSD",
                "interval": "1",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "enable_publishing": false,
                "backgroundColor": "#121212",
                "gridColor": "#2a2a2a",
                "hide_top_toolbar": false,
                "hide_legend": false,
                "save_image": false,
                "container_id": "tradingview_chart"
            });
            </script>
        </div>
        <!-- TradingView Widget END -->
        
    </div>

</body>
</html>
