<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX Master Pro</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; margin: 0; padding: 15px; text-align: center; }
        .header { font-size: 24px; font-weight: bold; color: #ffcc00; margin-bottom: 15px; }
        .stats { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-around; font-size: 16px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid #26a69a; text-align: left; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 15px; border: none; color: white; font-weight: bold; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .btn-buy { background-color: #26a69a; }
        .btn-sell { background-color: #ef5350; }
    </style>
</head>
<body>

    <div class="header">FX Master Pro</div>

    <div class="stats">
        <div>Balance: <strong>$10,500</strong></div>
        <div>Equity: <strong>$10,480</strong></div>
    </div>

    <div class="card">
        <h3 style="margin: 0 0 10px 0; color: #26a69a;">Live Signal</h3>
        {% for s in signals %}
        <p><b>Pair:</b> {{ s.pair }} | <b>Type:</b> {{ s.type }}</p>
        <p><b>Entry:</b> {{ s.entry }} | <b>TP/SL:</b> {{ s.tp }} / {{ s.sl }}</p>
        <hr style="border-color: #333;">
        {% endfor %}
    </div>

    <div class="btn-group">
        <button class="btn-buy" onclick="alert('BUY Signal Executed!')">BUY</button>
        <button class="btn-sell" onclick="alert('SELL Signal Executed!')">SELL</button>
    </div>

</body>
</html>
